name: Сборка APK водителя
on: { workflow_dispatch: {}, push: { paths: ['android-driver/**'] } }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle -p android-driver assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: taxidesk-driver-apk, path: android-driver/app/build/outputs/apk/debug/app-debug.apk }
